name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_checks:
        description: 'Run checks'
        type: boolean
        default: true
      run_release:
        description: 'Run FerrFlow release'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-frontend:
    name: Check (frontend)
    if: github.event_name != 'workflow_dispatch' || inputs.run_checks != false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run build

  check-api:
    name: Check (api)
    if: github.event_name != 'workflow_dispatch' || inputs.run_checks != false
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: fmt
        working-directory: api
        run: cargo fmt --check
      - name: clippy
        working-directory: api
        run: cargo clippy -- -D warnings
      - name: test
        working-directory: api
        run: cargo test

  release:
    name: Release with FerrFlow
    needs: [check-frontend, check-api]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.run_release != false) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: FerrLabs/FerrFlow@v4
        with:
          bot: true
