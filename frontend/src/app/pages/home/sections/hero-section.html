<section id="hero" class="hero">
  <div class="grid-overlay" aria-hidden="true" [appParallax]="320"></div>

  <div class="hero-content">
    <p class="label">{{ t(text.kicker) }}</p>
    <h1 class="hero-name">
      <span class="sizer" aria-hidden="true">{{ name }}</span>
      <span class="typed" aria-hidden="true"
        >{{ line1()
        }}@if (phase() === 'name') {
          <span class="cursor blink">_</span>
        }</span
      >
      <span class="visually-hidden">{{ name }}</span>
    </h1>
    <h2 class="hero-role">
      <span class="sizer" aria-hidden="true">{{ role }}_</span>
      <span class="typed" aria-hidden="true"
        >{{ line2()
        }}@if (phase() === 'role') {
          <span class="cursor blink">_</span>
        } @else if (phase() === 'done') {
          <span class="cursor">_</span>
        }</span
      >
      <span class="visually-hidden">{{ role }}</span>
    </h2>
    <div class="hero-actions">
      <button type="button" class="btn-primary" (click)="navigate.emit('projets')">
        {{ t(text.seeProjects) }}
      </button>
      <button type="button" class="btn-ghost" (click)="navigate.emit('contact')">
        {{ t(text.contactMe) }}
      </button>
    </div>
  </div>

  <div class="scroll-hint" aria-hidden="true">
    <span class="scroll-line"></span>
    <span class="scroll-text">scroll</span>
  </div>
</section>
