<nav class="navbar" aria-label="Navigation principale">
  <span class="navbar-brand">&gt; bryan.ferrando</span>
  <div class="navbar-right">
    <ul>
      @for (link of navLinks; track link.id) {
        <li>
          <button
            type="button"
            [class.active]="activeSection() === link.id"
            (click)="scrollTo(link.id)"
          >
            {{ t(link.label) }}
          </button>
        </li>
      }
    </ul>
    <div class="navbar-lang" translate="no">
      <a routerLink="/" [class.active]="locale() === 'fr'">fr</a>
      <span aria-hidden="true">/</span>
      <a routerLink="/en" [class.active]="locale() === 'en'">en</a>
    </div>
  </div>
</nav>

<app-hero-section (navigate)="scrollTo($event)" />
<app-projects-section />
<app-stack-section />
<app-contact-section />

<footer class="footer">
  <span>© {{ currentYear }} Bryan Ferrando</span>
  <span>built with Angular + Rust <span class="footer-arrow" aria-hidden="true">↑</span></span>
</footer>
